<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly Meadow · Sambhab's playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="playground.css">
</head>

<body>
    <header class="pg-top">
        <a class="pg-brand" href="index.html#playground">sambhab / playground</a>
        <nav class="pg-switch">
            <a href="meadow.html" aria-current="page">meadow</a>
            <a href="ramp.html">mini ramp</a>
            <a href="launch.html">launch</a>
            <a href="jensen.html">#bringbackjensen</a>
        </nav>
    </header>

    <main class="pg-stage">
        <canvas id="meadow" class="pg-canvas" aria-label="A pixel meadow with a butterfly"></canvas>
        <p class="pg-title" id="title"></p>
        <p class="pg-caption" id="caption"></p>
        <p class="pg-hint">tap a flower to scatter its petals · tap anywhere to call the butterfly · drag to fly it</p>
        <div class="pg-tray" id="tray">
            <button type="button" class="pg-btn" id="pause" aria-pressed="false">pause</button>
        </div>
    </main>

    <p class="pg-foot">drawn pixel by pixel · <a href="index.html">back home</a></p>

    <script type="module">
        import { createMeadow, renderStill, SCENES } from './animations/meadow/meadow.js';

        const meadow = createMeadow(document.getElementById('meadow'));
        const tray = document.getElementById('tray');
        const pause = document.getElementById('pause');
        const thumbs = SCENES.map((s, i) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'pg-thumb';
            b.title = s.title;
            b.setAttribute('aria-label', s.title);
            const c = document.createElement('canvas');
            b.appendChild(c);
            renderStill(c, i);
            b.addEventListener('click', () => show(i));
            tray.insertBefore(b, pause);
            return b;
        });

        function show(i) {
            meadow.setScene(i);
            document.getElementById('title').textContent = meadow.scene.title;
            document.getElementById('caption').textContent = meadow.scene.caption;
            thumbs.forEach((t, k) => t.setAttribute('aria-current', k === meadow.index));
        }

        pause.addEventListener('click', () => {
            const p = meadow.togglePause();
            pause.textContent = p ? 'play' : 'pause';
            pause.setAttribute('aria-pressed', p);
        });
        show(0);
    </script>
</body>

</html>
