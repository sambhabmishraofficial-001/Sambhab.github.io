<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly Meadow - Sambhab Mishra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fff;
            color: #23272a;
            font-family: 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .corner {
            position: fixed;
            top: 22px;
            left: 24px;
            z-index: 2;
            font-size: 14px;
            line-height: 1.5;
        }

        .corner a {
            color: inherit;
            text-decoration: none;
        }

        .back {
            display: inline-flex;
            align-items: center;
            padding: 6px 15px;
            font-weight: 500;
            font-size: 15px;
            color: #23272a;
            background: #fff;
            border: 1px solid #23272a;
            border-radius: 7px;
            box-shadow:
                3px 3px 0 -1px #fff,
                3px 3px 0 0 #23272a,
                6px 6px 0 -1px #fff,
                6px 6px 0 0 #23272a;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .back:hover,
        .back:focus-visible { transform: rotate(-2deg); outline: none; }

        .back:active {
            transform: translate(3px, 3px);
            box-shadow:
                0 0 0 -1px #fff,
                0 0 0 0 #23272a,
                3px 3px 0 -1px #fff,
                3px 3px 0 0 #23272a;
        }

        .credit {
            margin: 14px 0 0;
            color: #6b7b8e;
        }

        .credit a { border-bottom: 1px solid #d4d7dc; }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 92px 16px 28px;
        }

        h1 {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }

        #meadow {
            width: min(92vw, 600px);
            aspect-ratio: 160 / 116;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
            cursor: pointer;
            display: block;
        }

        .scene-name {
            margin: 22px 0 4px;
            font-weight: 500;
            font-size: 18px;
        }

        .scene-sub {
            margin: 0;
            font-weight: 300;
            color: #23272a;
            font-size: 15px;
        }

        .scene-hint {
            margin: 54px 0 18px;
            color: #6b7b8e;
            font-size: 14px;
            text-align: center;
        }

        .places {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 22px;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
        }

        .thumb {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
        }

        .thumb canvas {
            width: 92px;
            aspect-ratio: 160 / 116;
            image-rendering: pixelated;
            opacity: 0.45;
            filter: saturate(0.45);
            transition: opacity 0.3s, filter 0.3s;
        }

        .thumb:hover canvas { opacity: 0.75; }

        .thumb.on canvas {
            opacity: 1;
            filter: none;
        }

        .bar {
            width: 44px;
            height: 3px;
            margin-top: 7px;
            border-radius: 2px;
            overflow: hidden;
        }

        .thumb.on .bar { background: #e6e8eb; }

        .bar i {
            display: block;
            width: 0;
            height: 100%;
            background: #1d1d1f;
        }

        .thumb:not(.on) .bar i { width: 0 !important; }

        .sep {
            width: 1px;
            height: 52px;
            background: #e6e8eb;
        }

        #pause {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: none;
            cursor: pointer;
            color: #1d1d1f;
            display: grid;
            place-items: center;
        }

        #pause:hover { background: #f2f3f5; }
        #pause .play { display: none; }
        #pause.paused .play { display: block; }
        #pause.paused .bars { display: none; }

        @media (max-width: 560px) {
            main { padding-top: 84px; }
            .places { gap: 10px; padding: 10px 14px; }
            .thumb canvas { width: 58px; }
            .bar { width: 30px; }
            .scene-hint { margin-top: 34px; }
        }
    </style>
</head>

<body>
    <div class="corner">
        <a class="back" href="index.html">← Back to Home</a>
        <p class="credit">inspired by <a href="https://www.bubbbly.com/butterfly-meadow" target="_blank" rel="noopener">Butterfly Meadow</a> by Ann Nguyen</p>
    </div>

    <main>
        <h1>Butterfly Meadow</h1>
        <canvas id="meadow" aria-label="A pixel meadow with a white butterfly"></canvas>
        <p class="scene-name" id="scene-name"></p>
        <p class="scene-sub" id="scene-sub"></p>
        <p class="scene-hint" id="scene-hint"></p>
        <nav class="places" id="places" aria-label="Places">
            <span class="sep" aria-hidden="true"></span>
            <button type="button" id="pause" aria-label="Pause" aria-pressed="false">
                <svg class="bars" width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="3" height="12" rx="1" /><rect x="8" y="1" width="3" height="12" rx="1" /></svg>
                <svg class="play" width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><path d="M2 1.5v11a.8.8 0 0 0 1.2.7l8.6-5.5a.8.8 0 0 0 0-1.4L3.2.8A.8.8 0 0 0 2 1.5z" /></svg>
            </button>
        </nav>
    </main>

    <script src="animations/butterfly/butterfly.js"></script>
</body>

</html>
