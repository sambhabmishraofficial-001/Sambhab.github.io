<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tie-Break</title>
<style>
  :root { --ink: #23272a; --muted: #6b7b8e; --paper: #fff; --a: #ec6450; --b: #2e4682; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; outline: none; }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  #scores { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 2px; pointer-events: none; }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); align-items: flex-end; }
  .team { display: flex; align-items: center; gap: 8px; }
  .team b { font-size: 16px; font-weight: 600; min-width: 2ch; font-variant-numeric: tabular-nums; }
  .team i { width: 6px; height: 6px; background: currentColor; opacity: 0; border-radius: 1px; }
  .team i.on { opacity: 1; }
  #you { color: var(--a); } #rival { color: var(--b); }
  #status { color: var(--muted); }
  button { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Clay tennis court. Tap, click or press space to serve and to hit the ball."></canvas></div>
<div id="scores">
  <div class="team" id="you"><b id="s0">0</b><i id="d0"></i></div>
  <div class="team" id="rival"><b id="s1">0</b><i id="d1"></i></div>
</div>
<div class="hud" id="bottom">
  <div id="status" role="status" aria-live="polite"></div>
  <button id="mute" type="button" aria-pressed="false">sound on</button>
</div>
<script src="../shell.js"></script>
<script>
PixelPlays.mount({
  id: 'tie-break',
  rules: [
    'Your player runs on their own. You only choose the moment to hit: tap, click or press space.',
    'After the ball bounces on your side, a ring sweeps across the far court. It shows where your shot will land. Hit when it is away from the rival.',
    'A yellow ring is in, a blue ring is out. The closer to the line, the harder for the rival to reach.',
    'To serve, tap to toss and tap again to hit into the diagonal box. Two faults lose the point.',
    'Rallies speed up. First to 7 with a two-point lead wins.',
  ],
});
</script>
<script>
'use strict';

/* ---------- Risograph print engine (matching houses.js / ucl.js) ---------- */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

const INK = {
  blue: [46, 70, 130],
  coral: [236, 100, 80],
  sun: [255, 204, 46],
  teal: [0, 138, 136],
};
const ANGLE = { blue: 15, coral: 75, sun: 0, teal: 45 };
const SHIFT = { blue: [0.3, -0.2], coral: [-0.4, 0.3], sun: [0.25, 0.45], teal: [-0.3, -0.4] };
const TAU = Math.PI * 2;
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

const GREEN = [['teal', 0.72], ['sun', 0.55]];
const LEAF = [['teal', 0.5], ['sun', 0.8]];
const CLAY = [['coral', 0.68], ['sun', 0.42]];
const CLAY_WEAR = [['coral', 0.45], ['sun', 0.35]];
const WOOD = [['coral', 0.48], ['sun', 0.45]];
const RED = [['coral', 0.9], ['blue', 0.15]];
const ORANGE = [['coral', 0.6], ['sun', 0.7]];
const PURPLE = [['blue', 0.45], ['coral', 0.5]];

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);

function hash(...parts) {
  let h = 2166136261;
  for (const p of parts) {
    const s = String(p);
    for (let k = 0; k < s.length; k++) {
      h ^= s.charCodeAt(k);
      h = Math.imul(h, 16777619);
    }
  }
  return h >>> 0;
}

function rand(seed) {
  let s = (seed >>> 0) || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

const LEVELS = 16, CELL = 2.4, CELLS = 8, RES = 5;
const tiles = new Map();
function screenTile(ink, level) {
  const key = ink + level;
  let cv = tiles.get(key);
  if (cv) return cv;
  const cell = CELL * RES, size = cell * CELLS, tone = level / LEVELS;
  cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const c = cv.getContext('2d');
  const R = rand(hash('screen', ink, level));
  c.fillStyle = rgba(INK[ink]);
  if (tone >= 1) {
    c.fillRect(0, 0, size, size);
  } else if (tone <= 0.5) {
    for (let y = 0; y < CELLS; y++) {
      for (let x = 0; x < CELLS; x++) {
        const r = cell * Math.sqrt(tone / Math.PI) * (0.86 + R() * 0.24);
        c.beginPath();
        c.arc((x + 0.5) * cell + (R() - 0.5) * RES * 0.6, (y + 0.5) * cell + (R() - 0.5) * RES * 0.6, r, 0, TAU);
        c.fill();
      }
    }
  } else {
    c.fillRect(0, 0, size, size);
    c.globalCompositeOperation = 'destination-out';
    for (let y = 0; y <= CELLS; y++) {
      for (let x = 0; x <= CELLS; x++) {
        const r = cell * Math.sqrt((1 - tone) / Math.PI) * (0.86 + R() * 0.24);
        c.beginPath();
        c.arc(x * cell, y * cell, r, 0, TAU);
        c.fill();
      }
    }
  }
  c.globalCompositeOperation = 'destination-out';
  const n = Math.round(size * size / (RES * RES * 60));
  for (let k = 0; k < n; k++) {
    const s = (0.5 + R() * 1.3) * RES * (R() < 0.07 ? 2 : 1);
    c.globalAlpha = 0.25 + R() * 0.65;
    c.fillRect(R() * size, R() * size, s, s);
  }
  tiles.set(key, cv);
  return cv;
}

const patterns = new Map();
function pattern(ink, tone) {
  const level = clamp(Math.round(tone * LEVELS), 1, LEVELS);
  const key = ink + level;
  let p = patterns.get(key);
  if (!p) {
    p = ctx.createPattern(screenTile(ink, level), 'repeat');
    if (p.setTransform) p.setTransform(new DOMMatrix().rotateSelf(ANGLE[ink]).scaleSelf(1 / RES));
    patterns.set(key, p);
  }
  return p;
}

function Pen(c, seed) {
  const R = rand(seed);
  const P = { c, R };

  function wobble(pts, closed, amp) {
    const out = [];
    const n = pts.length, segs = closed ? n : n - 1;
    for (let s = 0; s < segs; s++) {
      const a = pts[s], b = pts[(s + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const steps = Math.max(1, Math.ceil(len / 8));
      const nx = -dy / len, ny = dx / len;
      for (let k = 0; k < steps; k++) {
        const t = k / steps, o = (R() - 0.5) * 2 * amp;
        out.push([a[0] + dx * t + nx * o, a[1] + dy * t + ny * o]);
      }
    }
    if (!closed) out.push(pts[n - 1]);
    return out;
  }

  P.path = pts => {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]);
    c.closePath();
  };

  P.knock = pts => {
    c.globalCompositeOperation = 'source-over';
    P.path(pts);
    c.fillStyle = '#fff';
    c.fill();
  };

  P.fill = (pts, ink, tone) => {
    if (tone <= 0.02) return;
    c.save();
    c.globalCompositeOperation = 'multiply';
    c.translate(SHIFT[ink][0], SHIFT[ink][1]);
    P.path(pts);
    c.fillStyle = pattern(ink, tone);
    c.fill();
    c.restore();
  };

  P.line = (pts, w = 1, ink = 'blue', closed = false, amp = 0.45) => {
    if (pts.length < 2) return;
    const q = wobble(pts, closed, amp);
    c.save();
    c.globalCompositeOperation = 'multiply';
    c.translate(SHIFT[ink][0], SHIFT[ink][1]);
    c.strokeStyle = rgba(INK[ink], 0.92);
    c.lineWidth = w;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(q[0][0], q[0][1]);
    for (let k = 1; k < q.length; k++) c.lineTo(q[k][0], q[k][1]);
    if (closed) c.closePath();
    c.stroke();
    c.restore();
  };

  P.chalk = (pts, w = 1.8, closed = false) => {
    const q = wobble(pts, closed, 0.28);
    c.save();
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = '#fff';
    c.lineWidth = w;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(q[0][0], q[0][1]);
    for (let k = 1; k < q.length; k++) c.lineTo(q[k][0], q[k][1]);
    if (closed) c.closePath();
    c.stroke();
    c.restore();
  };

  P.dot = (x, y, r, ink, tone, ry = 1) => {
    P.fill(ellipse(x, y, r, r * ry, 12), ink, tone);
  };

  return P;
}

/* ---------- Isometric projection ---------- */

const TW = 26, TH = 13, TZ = 19;
const iso = (x, y, z = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - z * TZ];
const flat = (x0, y0, z, x1, y1) => [iso(x0, y0, z), iso(x1, y0, z), iso(x1, y1, z), iso(x0, y1, z)];
const faceL = (x0, y0, z, x1, y1, h) => [iso(x0, y1, z), iso(x1, y1, z), iso(x1, y1, z + h), iso(x0, y1, z + h)];
const faceR = (x0, y0, z, x1, y1, h) => [iso(x1, y0, z), iso(x1, y1, z), iso(x1, y1, z + h), iso(x1, y0, z + h)];

function ellipse(x, y, rx, ry, n = 18) {
  const pts = [];
  for (let k = 0; k < n; k++) {
    const a = k / n * TAU;
    pts.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]);
  }
  return pts;
}
const circle = (x, y, r, n = 14) => ellipse(x, y, r, r, n);

function paint(P, pts, fills, k = 1, shade = 0) {
  P.knock(pts);
  for (const [ink, tone] of fills) P.fill(pts, ink, Math.min(1, tone * k));
  if (shade) P.fill(pts, 'blue', shade);
}
function shape(P, pts, fills = [], o = {}) {
  paint(P, pts, fills, 1, o.shade || 0);
  if (o.line !== false) P.line(pts, o.lw ?? 1, 'blue', true, o.amp ?? 0.4);
}
function block(P, x0, y0, z0, x1, y1, z1, fills = [], o = {}) {
  const h = z1 - z0, s = o.shade ?? 1;
  const L = faceL(x0, y0, z0, x1, y1, h);
  const Rf = faceR(x0, y0, z0, x1, y1, h);
  const T = flat(x0, y0, z1, x1, y1);
  paint(P, L, fills, 0.85, 0.1 * s);
  paint(P, Rf, fills, 1, 0.25 * s);
  paint(P, T, o.top || fills, 0.6, 0);
  const lw = o.lw ?? 0.9;
  P.line(L, lw, 'blue', true, 0.3);
  P.line(Rf, lw, 'blue', true, 0.3);
  P.line(T, lw, 'blue', true, 0.3);
}
function blob(P, x, y, r, fills, R, o = {}) {
  const pts = [];
  const n = 11;
  for (let k = 0; k < n; k++) {
    const a = k / n * TAU, rr = r * (0.82 + R() * 0.28);
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr * (o.squash ?? 0.9)]);
  }
  shape(P, pts, fills, { lw: o.lw ?? 0.9, shade: o.shade || 0 });
}

/* ---------- Game constants & state (Tie-Break) ---------- */

const COURT_X = 11, COURT_Y = 4.6, SERVICE_X = 6, APRON_X = 13.2, APRON_Y = 8.4;
const NET_Y = 5.2, NET_Z = 1.03, FENCE_X = -13.4, FENCE_Y = -8.8, FENCE_Z = 3.2;
const GRAVITY = 14, BALL_R = .22, BOUNCE_UP = .7, BOUNCE_ALONG = .55;
const BASE_X = 10.6, REACH_X = 1.3, REACH_Y = .45;
const SLOW_T = 1.25, FAST_T = .72, SLOW_WINDOW = .7, FAST_WINDOW = .42, PACE_RALLY = 14;
const SWEEP_Y = 6.4, SHOT_X = 7.2, SERVE_X = 4.4, SERVE_SWEEP = 3.7;
const TOSS_VZ = 7.2, TOSS_FROM = .34, TOSS_TO = .96;
const BOT_SPEED = 3.6, BOT_REACH = .8, WIN_SCORE = 7, PLAYER_SPEED = 16;

const TEAM = [
  { shirt: RED, hair: [['blue', 0.9]], racket: 'coral' },
  { shirt: [['blue', 0.72]], hair: [['blue', 0.45]], racket: 'blue' },
];
const CROWD = [
  { x: 1.8, shirt: [['sun', 0.85]], hair: [['coral', 0.5], ['blue', 0.5]] },
  { x: 3.3, shirt: [['teal', 0.7]], hair: [['blue', 0.4]] },
  { x: 4.3, shirt: PURPLE, hair: [['blue', 0.9]] },
  { x: 7.7, shirt: [['blue', 0.55]], hair: WOOD },
  { x: 9.4, shirt: ORANGE, hair: [['blue', 0.85]] },
];

const G = {
  phase: 'serve-wait', score: [0, 0], first: 0, server: 0, faults: 0, side: 1, rally: 0, longest: 0,
  ball: null, timer: 0, time: 0, status: '', clap: 0, spark: 0, sparkAt: null, dust: [], marks: [], lockout: 0,
  who: [
    { x: BASE_X, y: 0, swing: -1, serving: false, moved: 0, dir: Math.PI },
    { x: -BASE_X, y: 0, swing: -1, serving: false, moved: 0, dir: 0, stretch: 0, react: 0, tx: -BASE_X, ty: 0 },
  ],
};

const nodes = {
  s: [document.getElementById('s0'), document.getElementById('s1')],
  d: [document.getElementById('d0'), document.getElementById('d1')],
  status: document.getElementById('status'),
};
function renderHud() {
  for (let t = 0; t < 2; t++) {
    nodes.s[t].textContent = G.score[t];
    nodes.d[t].classList.toggle('on', G.server === t && G.phase !== 'over');
  }
}
function setStatus(text) {
  if (text === G.status) return;
  G.status = text;
  nodes.status.textContent = text;
}
const totalPoints = () => G.score[0] + G.score[1];
const pace = () => clamp(G.rally / PACE_RALLY, 0, 1);

/* ---------- Points & physics ---------- */

function startPoint() {
  const n = totalPoints();
  G.server = (G.first + Math.floor((n + 1) / 2)) % 2;
  G.side = n % 2 ? -1 : 1;
  G.faults = 0;
  G.rally = 0;
  renderHud();
  readyServe();
}
function readyServe() {
  const srv = G.who[G.server], rcv = G.who[1 - G.server], sign = G.server === 0 ? 1 : -1;
  srv.x = sign * (COURT_X + .4); srv.y = G.side * 1.6; srv.swing = -1; srv.serving = true;
  rcv.x = -sign * BASE_X; rcv.y = -G.side * 3; rcv.swing = -1; rcv.serving = false;
  rcv.tx = rcv.x; rcv.ty = rcv.y;
  G.ball = { x: srv.x - sign * .45, y: srv.y - sign * .42, z: 1.15, vx: 0, vy: 0, vz: 0, held: true, by: G.server };
  G.phase = 'serve-wait';
  G.timer = 0;
  if (G.server === 0) setStatus(G.faults ? 'second serve · tap to toss' : 'tap to toss');
  else setStatus(G.faults ? 'rival: second serve' : 'rival to serve');
}
function toss() {
  G.ball.held = false;
  G.ball.vz = TOSS_VZ;
  G.ball.t = 0;
  G.phase = 'toss';
  setStatus('');
}
function strike(by, x, y, T, kind) {
  const b = G.ball, hitter = G.who[by];
  const vx = (x - b.x) / T, vy = (y - b.y) / T, vz = (BALL_R - b.z + .5 * GRAVITY * T * T) / T;
  const up = (GRAVITY * T - vz) * BOUNCE_UP, after = up / GRAVITY * 1.15;
  const shot = {
    x: b.x, y: b.y, z: b.z, vx, vy, vz, by, kind, t: 0, T, land: { x, y }, landed: false, held: false,
    tc: T + after, after, v2x: vx * BOUNCE_ALONG, v2y: vy * BOUNCE_ALONG, judged: false, hit: false,
  };
  const wide = 2 * .8 * up / GRAVITY;
  const W = Math.min(lerp(SLOW_WINDOW, FAST_WINDOW, pace()), wide);
  shot.wS = shot.tc - W / 2; shot.wE = shot.tc + W / 2;
  G.ball = shot;
  hitter.swing = .35; hitter.serving = kind === 'serve';
  G.spark = .12; G.sparkAt = { x: b.x, y: b.y, z: b.z };
  G.rally++;
  G.longest = Math.max(G.longest, G.rally);
  G.phase = 'rally';
  sound(kind === 'serve' ? 'serve' : 'hit', .4 + pace() * .6);
  if (by === 0) planBot();
  else {
    const me = G.who[0], c = ballAt(shot, shot.wS);
    me.tx = c.x + REACH_X; me.ty = c.y + REACH_Y;
  }
}
function ballAt(b, t) {
  return { x: b.land.x + b.v2x * (t - b.T), y: b.land.y + b.v2y * (t - b.T) };
}
function planBot() {
  const b = G.ball, bot = G.who[1], c = ballAt(b, b.tc);
  bot.tx = c.x - REACH_X; bot.ty = c.y - REACH_Y;
  bot.react = .1;
  const d = Math.hypot(bot.tx - bot.x, bot.ty - bot.y);
  bot.stretch = d / (BOT_SPEED * Math.max(.2, b.tc - .1));
}
function botReturn() {
  const bot = G.who[1], b = G.ball, gap = Math.hypot(bot.tx - bot.x, bot.ty - bot.y);
  b.hit = true;
  if (gap > BOT_REACH) { b.passed = G.time; return; }
  const s = clamp(bot.stretch, 0, 1), miss = .02 + .26 * s * s * s + pace() * .03;
  const T = lerp(SLOW_T, FAST_T, pace());
  if (Math.random() < miss) {
    const kind = Math.random();
    if (kind < .35) return strike(1, 2, b.y * .4, .7, 'rally');
    if (kind < .7) return strike(1, 12.4, (Math.random() - .5) * 6, Math.max(T, 1), 'rally');
    return strike(1, lerp(5, 9, Math.random()), (Math.random() < .5 ? -1 : 1) * (5.2 + Math.random() * 1.6), T, 'rally');
  }
  const side = G.who[0].y > 0 ? -1 : 1;
  if (s < .55) strike(1, lerp(6.5, 8.2, Math.random()), side * (2.8 + Math.random() * 1.5), Math.max(FAST_T - .06, T - .06), 'rally');
  else strike(1, lerp(6.5, 8.2, Math.random()), (Math.random() - .5) * 3.6, T + .15, 'rally');
}
function aim() {
  const b = G.ball;
  if (G.phase === 'toss' && G.server === 0) {
    if (b.t < TOSS_FROM || b.t > TOSS_TO) return null;
    const c = -G.side * 2.3;
    return { x: -SERVE_X, y: lerp(c - SERVE_SWEEP, c + SERVE_SWEEP, (b.t - TOSS_FROM) / (TOSS_TO - TOSS_FROM)), serve: true };
  }
  if (G.phase === 'rally' && b.by === 1 && !b.hit && b.t >= b.wS && b.t <= b.wE) {
    return { x: -SHOT_X, y: lerp(-SWEEP_Y, SWEEP_Y, (b.t - b.wS) / (b.wE - b.wS)), serve: false };
  }
  return null;
}
function isIn(target) {
  if (Math.abs(target.y) > COURT_Y) return false;
  return !target.serve || Math.sign(target.y) === -G.side;
}
function tap() {
  ensureAudio();
  if (G.phase === 'over') { if (G.timer > .5) resetMatch(); return; }
  if (G.phase === 'point-end') { if (G.timer > .4) startPoint(); return; }
  if (G.lockout > 0) return;
  if (G.phase === 'serve-wait' && G.server === 0) return toss();
  const me = G.who[0], target = aim();
  if (target) {
    me.serving = target.serve;
    return strike(0, target.x, target.y, target.serve ? .76 : lerp(SLOW_T, FAST_T, pace()), target.serve ? 'serve' : 'rally');
  }
  if (G.phase === 'toss' || G.phase === 'rally') { me.swing = 0; G.lockout = .18; }
}
function pointEnd(winner, text) {
  if (G.phase === 'point-end' || G.phase === 'over') return;
  G.score[winner]++;
  const [a, b] = G.score, lead = Math.abs(a - b);
  G.timer = 0;
  if (winner === 0 && G.rally > 2 || text === 'winner') G.clap = 1.4;
  sound('point', winner === 0 ? 1 : .4);
  if (Math.max(a, b) >= WIN_SCORE && lead >= 2) {
    G.phase = 'over';
    G.clap = 2.4;
    setStatus((winner === 0 ? 'you win ' : 'rival wins ') + a + '–' + b + ' · longest rally ' + G.longest + ' · tap to play again');
  } else {
    G.phase = 'point-end';
    setStatus(text);
  }
  renderHud();
}
function fault(text) {
  G.faults++;
  if (G.faults >= 2) return pointEnd(1 - G.server, 'double fault');
  G.phase = 'fault-wait';
  G.timer = 0;
  setStatus(text);
  sound('net', .5);
}
function resetMatch() {
  G.score = [0, 0];
  G.first = 1 - G.first;
  G.longest = 0;
  G.marks = [];
  startPoint();
}
function land(b) {
  b.landed = true;
  if (Math.abs(b.x) <= APRON_X && Math.abs(b.y) <= APRON_Y) {
    G.marks.push([b.x, b.y]);
    if (G.marks.length > 40) G.marks.shift();
  }
  sound('bounce', .7);
  for (let k = 0; k < 6; k++) {
    G.dust.push({ x: b.x, y: b.y, z: .1, vx: (Math.random() - .5) * 2.4 + b.vx * .06, vy: (Math.random() - .5) * 2.4 + b.vy * .06, vz: 1 + Math.random() * 1.4, life: .32 });
  }
  if (b.judged || G.phase !== 'rally') return;
  b.judged = true;
  const far = b.by === 0 ? b.x < 0 : b.x > 0;
  if (b.kind === 'serve') {
    const inBox = far && Math.abs(b.x) <= SERVICE_X && Math.abs(b.y) <= COURT_Y && Math.sign(b.y) === -G.side;
    if (!inBox) fault('fault');
    return;
  }
  if (!far) return pointEnd(1 - b.by, b.by === 0 ? 'net' : 'rival netted it');
  if (Math.abs(b.x) > COURT_X || Math.abs(b.y) > COURT_Y) pointEnd(1 - b.by, b.by === 0 ? 'out' : 'rival hit it out');
}
function stepBall(b, dt) {
  if (b.held) return;
  const px = b.x;
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.z += b.vz * dt - .5 * GRAVITY * dt * dt;
  b.vz -= GRAVITY * dt;
  if (px * b.x < 0 && b.z < NET_Z + BALL_R && Math.abs(b.y) < NET_Y) {
    b.x = px; b.vx *= -.08; b.vy *= .3; b.vz = Math.min(b.vz, 0);
    sound('net', .8);
    if (G.phase === 'rally') {
      b.judged = true;
      if (b.kind === 'serve') fault('net');
      else pointEnd(1 - b.by, b.by === 0 ? 'net' : 'rival netted it');
    }
  }
  if (b.z <= BALL_R) {
    b.z = BALL_R;
    if (!b.landed && b.T) {
      land(b);
      b.vz = -b.vz * BOUNCE_UP; b.vx *= BOUNCE_ALONG; b.vy *= BOUNCE_ALONG;
    } else if (b.vz < -1) {
      b.vz *= -BOUNCE_UP; b.vx *= .8; b.vy *= .8;
      sound('bounce', .3);
    } else {
      b.vz = 0;
      const sp = Math.hypot(b.vx, b.vy), next = Math.max(0, sp - 5 * dt);
      if (sp > 0) { b.vx *= next / sp; b.vy *= next / sp; }
    }
  }
  if (Math.abs(b.x) > APRON_X) { b.x = Math.sign(b.x) * APRON_X; b.vx *= -.25; }
  if (Math.abs(b.y) > APRON_Y) { b.y = Math.sign(b.y) * APRON_Y; b.vy *= -.25; }
}
function moveTo(p, tx, ty, speed, dt) {
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy), step = Math.min(d, speed * dt);
  if (d > .001) { p.x += dx / d * step; p.y += dy / d * step; }
  p.moved = dt > 0 ? step / dt : 0;
}
function update(dt) {
  G.time += dt;
  G.lockout = Math.max(0, G.lockout - dt);
  G.clap = Math.max(0, G.clap - dt);
  G.spark = Math.max(0, G.spark - dt);
  G.timer += dt;
  const b = G.ball, me = G.who[0], bot = G.who[1];
  for (const p of G.who) if (p.swing >= 0) { p.swing += dt / .3; if (p.swing >= 1) { p.swing = -1; p.serving = false; } }
  for (const d of G.dust) { d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt; d.vz -= 7 * dt; d.life -= dt; }
  if (G.dust.length) G.dust = G.dust.filter(d => d.life > 0 && d.z > 0);

  if (G.phase === 'serve-wait') {
    me.moved = bot.moved = 0;
    if (G.server === 1 && G.timer > .85) toss();
  } else if (G.phase === 'toss') {
    b.t += dt;
    if (G.server === 1 && b.t >= .55) {
      const fails = Math.random() < (G.faults ? .03 : .14);
      const y = fails ? -G.side * (5.2 + Math.random()) : -G.side * lerp(.9, 3.9, Math.random());
      strike(1, SERVE_X, y, .82, 'serve');
    } else if (b.z < 1.15 && b.vz < 0) {
      readyServe();
    }
  } else if (G.phase === 'rally' && b) {
    b.t += dt;
    if (b.by === 1 && !b.hit) {
      if (b.t >= b.wS) { me.tx = b.x + REACH_X; me.ty = b.y + REACH_Y; }
      const left = b.wS - b.t;
      moveTo(me, me.tx, me.ty, left > .02 ? Math.min(PLAYER_SPEED, Math.hypot(me.tx - me.x, me.ty - me.y) / left) : PLAYER_SPEED, dt);
      moveTo(bot, -BASE_X, bot.y * .3, 2.6, dt);
      if (b.landed && b.t > b.wE) {
        b.hit = true;
        return pointEnd(1, b.kind === 'serve' ? 'ace' : 'missed');
      }
    } else if (b.by === 0 && !b.hit) {
      moveTo(me, BASE_X, 0, 6, dt);
      if (b.t < bot.react) bot.moved = 0;
      else moveTo(bot, bot.tx, bot.ty, BOT_SPEED, dt);
      if (b.landed && b.t >= b.tc) {
        botReturn();
        if (G.ball.passed != null) pointEnd(0, 'winner');
      }
    }
  } else if (G.phase === 'fault-wait') {
    if (G.timer > .95) readyServe();
    me.moved = bot.moved = 0;
  } else {
    moveTo(me, me.x, me.y, 0, dt);
    bot.moved = 0;
    if (G.phase === 'point-end' && G.timer > 1.7) startPoint();
  }
  if (G.ball && !G.ball.held) for (let k = 0; k < 4; k++) stepBall(G.ball, dt / 4);
}

/* ---------- Risograph court drawing ---------- */

function drawTree(P, x, y, s, R) {
  const [tx, ty] = iso(x, y, 0);
  P.dot(tx, ty + 2, 22 * s, 'blue', 0.18, 0.45);
  block(P, x - 0.22 * s, y - 0.22 * s, 0, x + 0.22 * s, y + 0.22 * s, 2.1 * s, WOOD, { lw: 0.8 });
  const [cx, cy] = iso(x, y, 2.7 * s);
  const clusters = [[0, 0, 22], [-16, 6, 16], [16, 5, 17], [-6, -13, 16], [10, -11, 15], [0, 11, 14]];
  for (const [dx, dy, r] of clusters) {
    blob(P, cx + dx * s, cy + dy * s, r * s, R() < 0.5 ? GREEN : LEAF, R, { shade: 0.08, lw: 0.85 });
  }
}

function drawFence(P, x0, y0, x1, y1) {
  const len = Math.hypot(x1 - x0, y1 - y0);
  // Subtle mesh lines
  const posts = Math.ceil(len / 4);
  for (let k = 0; k <= Math.ceil(len / 1.1); k++) {
    const t = k / Math.ceil(len / 1.1);
    const x = lerp(x0, x1, t), y = lerp(y0, y1, t);
    P.line([iso(x, y, 0), iso(x, y, FENCE_Z)], 0.45, 'blue', false, 0.25);
  }
  for (let z = 0.65; z < FENCE_Z; z += 0.65) {
    P.line([iso(x0, y0, z), iso(x1, y1, z)], 0.45, 'blue', false, 0.25);
  }
  for (let k = 0; k <= posts; k++) {
    const t = k / posts, x = lerp(x0, x1, t), y = lerp(y0, y1, t);
    P.line([iso(x, y, 0), iso(x, y, FENCE_Z)], 1.6, 'blue', false, 0.25);
  }
  P.line([iso(x0, y0, FENCE_Z), iso(x1, y1, FENCE_Z)], 1.6, 'blue', false, 0.3);
}

function drawFigure(P, x, y, z, o = {}) {
  const s = o.s || 0.82, t = o.t || 0, run = o.run || false;
  const [fx, fy] = iso(x, y, z);
  P.dot(fx, fy, 7.5 * s, 'blue', 0.22, 0.42);
  const sit = o.sit || false;
  const step = run ? Math.sin(t * 14) * 3.5 * s : 0;
  const hip = fy - (sit ? 7 : 11.5) * s, neck = hip - 10.5 * s, hy = neck - 5 * s;
  if (sit) {
    P.line([[fx - 2 * s, hip], [fx + 3 * s, hip + 2 * s], [fx + 3 * s, fy]], 2.6 * s, 'blue', false, 0.15);
    P.line([[fx + 1.5 * s, hip], [fx + 6 * s, hip + 2 * s], [fx + 6 * s, fy - 1 * s]], 2.6 * s, 'blue', false, 0.15);
  } else {
    P.line([[fx - 2 * s, hip], [fx - 2 * s + step, fy]], 2.6 * s, 'blue', false, 0.15);
    P.line([[fx + 2 * s, hip], [fx + 2 * s - step, fy]], 2.6 * s, 'blue', false, 0.15);
  }
  const body = [[fx - 4.6 * s, hip + s], [fx + 4.6 * s, hip + s], [fx + 3.8 * s, neck], [fx - 3.8 * s, neck]];
  shape(P, body, o.shirt || RED, { shade: 0.08, lw: 0.85 });

  const swing = o.swing ?? -1;
  const up = o.armsUp ? 9 * s : 0;
  const face = o.face ?? 1;
  let rx = fx + 6 * s * face, ry = hip - 1.5 * s - up;
  let lx = fx - 5.5 * s * face, ly = hip - 1.5 * s - up;
  if (swing >= 0) {
    const a = ease(swing);
    if (o.serving) {
      rx = fx + lerp(-2, 8, a) * s * face;
      ry = neck + lerp(-12, 2, a) * s;
    } else {
      rx = fx + lerp(-7, 9, a) * s * face;
      ry = neck + lerp(4, -4, a) * s;
    }
  } else if (o.ready) {
    rx = fx - 6.5 * s * face;
    ry = neck + 4 * s;
  } else if (o.serving && G.phase === 'toss') {
    rx = fx - 2 * s * face;
    ry = neck - 10 * s;
    lx = fx + 4 * s * face;
    ly = neck - 9 * s;
  }

  P.line([[fx - 3.8 * s * face, neck + 1.5 * s], [lx, ly]], 2 * s, 'blue', false, 0.15);
  P.line([[fx + 3.8 * s * face, neck + 1.5 * s], [rx, ry]], 2 * s, 'blue', false, 0.15);

  if (o.racket) {
    const dx = (rx - fx) * 0.75 + 4 * s * face;
    const dy = (ry - neck) * 0.65 - 4 * s;
    const hdx = rx + dx, hdy = ry + dy;
    P.line([[rx, ry], [hdx, hdy]], 1.4, o.racket, false, 0.1);
    shape(P, ellipse(hdx, hdy, 4.2 * s, 5.2 * s, 10), [], { lw: 1.1, amp: 0.15 });
    P.line([[hdx - 2.5 * s, hdy], [hdx + 2.5 * s, hdy]], 0.5, 'blue', false, 0.08);
    P.line([[hdx, hdy - 3.2 * s], [hdx, hdy + 3.2 * s]], 0.5, 'blue', false, 0.08);
  }

  const head = circle(fx, hy, 4.5 * s, 12);
  P.knock(head);
  P.fill(head, 'coral', 0.2);
  P.line(head, 0.85, 'blue', true, 0.15);
  const hair = [];
  for (let k = 0; k <= 8; k++) {
    const a = Math.PI + Math.PI * k / 8;
    hair.push([fx + Math.cos(a) * 4.8 * s, hy - 0.5 * s + Math.sin(a) * 4.8 * s]);
  }
  shape(P, hair, o.hair || [['blue', 0.85]], { lw: 0.65 });
}

function drawCourtBase(P, R) {
  // Grass slab with thickness (just like houses.js floor shell)
  block(P, -15.6, -10.4, -0.55, 15.6, 10.4, 0, [['coral', 0.35], ['sun', 0.3]], { top: GREEN, lw: 1 });
  for (let n = 0; n < 320; n++) {
    const gx = -15.2 + R() * 30.4, gy = -10 + R() * 20;
    if (Math.abs(gx) < APRON_X + 0.3 && Math.abs(gy) < APRON_Y + 0.3) continue;
    const [px, py] = iso(gx, gy, 0);
    P.line([[px, py], [px + (R() - 0.5) * 2, py - 2.5 - R() * 2]], 0.7, R() < 0.6 ? 'teal' : 'sun', false, 0.1);
  }

  // Clay apron + subtle worn baseline bands
  shape(P, flat(-APRON_X, -APRON_Y, 0.01, APRON_X, APRON_Y), CLAY, { lw: 0.9 });
  P.fill(flat(-COURT_X - 1, -COURT_Y, 0.01, -COURT_X + 1.2, COURT_Y), 'sun', 0.14);
  P.fill(flat(COURT_X - 1.2, -COURT_Y, 0.01, COURT_X + 1, COURT_Y), 'sun', 0.14);

  // Crisp chalk court lines
  P.chalk(flat(-COURT_X, -COURT_Y, 0.02, COURT_X, COURT_Y), 2, true);
  P.chalk([iso(-SERVICE_X, -COURT_Y, 0.02), iso(-SERVICE_X, COURT_Y, 0.02)], 1.6);
  P.chalk([iso(SERVICE_X, -COURT_Y, 0.02), iso(SERVICE_X, COURT_Y, 0.02)], 1.6);
  P.chalk([iso(-SERVICE_X, 0, 0.02), iso(SERVICE_X, 0, 0.02)], 1.6);

  // Trees & fences along the back edges
  drawTree(P, -14.8, 2.6, 1.05, R);
  drawTree(P, 3.0, -9.8, 0.9, R);
  drawFence(P, FENCE_X, FENCE_Y, 13.2, FENCE_Y);
  drawFence(P, FENCE_X, FENCE_Y, FENCE_X, 8.4);

  // Bench, gear bag, bottle, and ball basket
  block(P, -9.4, -8.5, 0.6, -5.2, -7.9, 0.75, WOOD, { lw: 0.7 });
  block(P, -9.4, -8.55, 0.9, -5.2, -8.42, 1.45, WOOD, { lw: 0.7 });
  for (const x of [-9.2, -5.5]) block(P, x, -8.45, 0, x + 0.18, -7.95, 0.6, [['blue', 0.7]], { lw: 0.6 });
  block(P, -8.6, -8.3, 0.75, -7.5, -7.95, 1.12, [['teal', 0.7]], { lw: 0.6 });
  block(P, -3.9, -8.4, 0, -3.0, -7.6, 0.75, [['blue', 0.25]], { lw: 0.7 });
  for (let k = 0; k < 6; k++) {
    const [bx, by] = iso(-3.7 + (k % 3) * 0.25, -8.2 + Math.floor(k / 3) * 0.28, 0.85);
    shape(P, circle(bx, by, 2.5, 8), [['sun', 0.95]], { lw: 0.5, amp: 0.1 });
  }

  // Umpire high chair
  for (const [lx, ly] of [[-0.45, -7.1], [0.45, -7.1], [-0.45, -6.2], [0.45, -6.2]]) {
    P.line([iso(lx, ly, 0), iso(lx, ly, 1.7)], 1.4, 'blue', false, 0.15);
  }
  block(P, -0.58, -7.2, 1.7, 0.58, -6.1, 1.85, WOOD, { lw: 0.7 });
  drawFigure(P, 0, -6.65, 1.85, { s: 0.72, sit: true, shirt: [['teal', 0.5], ['blue', 0.4]], hair: [['blue', 0.35]] });
}

function drawNet(P) {
  // Net shadow on clay
  P.line([iso(0.25, -NET_Y, 0.02), iso(0.25, NET_Y, 0.02)], 3.5, 'blue', false, 0.2);
  // Net mesh
  for (let y = -NET_Y; y <= NET_Y; y += 0.65) {
    P.line([iso(0, y, 0.05), iso(0, y, NET_Z)], 0.55, 'blue', false, 0.15);
  }
  for (let z = 0.25; z < NET_Z; z += 0.28) {
    P.line([iso(0, -NET_Y, z), iso(0, NET_Y, z)], 0.55, 'blue', false, 0.15);
  }
  // White top tape & posts
  P.chalk([iso(0, -NET_Y, NET_Z), iso(0, NET_Y, NET_Z)], 2.6);
  P.line([iso(0, -NET_Y, NET_Z), iso(0, NET_Y, NET_Z)], 0.6, 'blue', false, 0.15);
  for (const y of [-NET_Y, NET_Y]) {
    block(P, -0.1, y - 0.1, 0, 0.1, y + 0.1, NET_Z + 0.12, [['blue', 0.8]], { lw: 0.7 });
  }
}

function drawTarget(P, target) {
  const [x, y] = iso(target.x, target.y, 0.03);
  const ok = isIn(target);
  const ring = ellipse(x, y, 11, 5.5, 18);
  if (ok) {
    P.line(ring, 4.2, 'sun', true, 0.2);
    P.line(ring, 1.2, 'blue', true, 0.15);
    P.dot(x, y, 2.4, 'sun', 1);
  } else {
    P.chalk(ring, 3.2, true);
    P.line(ring, 1.8, 'blue', true, 0.2);
    P.dot(x, y, 2.2, 'blue', 0.9);
  }
}

function drawLive(P, t) {
  // Clay bounce scuff marks
  for (const [mx, my] of G.marks) {
    const [sx, sy] = iso(mx, my, 0.02);
    P.dot(sx, sy, 2.4, 'blue', 0.16, 0.5);
  }

  // Crowd along the far fence
  const clapping = G.clap > 0;
  CROWD.forEach((c, k) => {
    const beat = clapping && Math.floor(t * 9 + k * 1.6) % 2;
    drawFigure(P, c.x, -8.0, 0, { t, s: 0.72, shirt: c.shirt, hair: c.hair, armsUp: beat });
  });

  // Target aim ring (drawn on court under players)
  const target = aim();
  if (target) drawTarget(P, target);

  // Rival (far side of net)
  const bot = G.who[1], b = G.ball;
  const botReady = b && !b.held && !b.hit && b.by === 0 && G.phase === 'rally' && b.t > b.tc - 0.36;
  drawFigure(P, bot.x, bot.y, 0, {
    t, s: 0.85, run: bot.moved > 1.2, swing: bot.swing, serving: bot.serving,
    ready: botReady, face: 1, shirt: TEAM[1].shirt, hair: TEAM[1].hair, racket: TEAM[1].racket,
  });

  // Ball if on far side of net
  const drawBall = () => {
    if (!b) return;
    const [sx, sy] = iso(b.x, b.y, 0.02);
    P.dot(sx, sy, clamp(4.5 * (1 - b.z / 7), 1.8, 4.5), 'blue', 0.3, 0.45);
    const [bx, by] = iso(b.x, b.y, b.z);
    shape(P, circle(bx, by, 3.6, 10), [['sun', 1]], { lw: 0.85, amp: 0.1 });
  };
  if (b && b.x < 0) drawBall();

  // Net sits between rival and player
  drawNet(P);

  // Ball if on near side of net
  if (b && b.x >= 0) drawBall();

  // Player (near side)
  const me = G.who[0];
  const meReady = b && !b.held && !b.hit && b.by === 1 && G.phase === 'rally' && b.t > b.wS - 0.08;
  drawFigure(P, me.x, me.y, 0, {
    t, s: 0.88, run: me.moved > 1.2, swing: me.swing, serving: me.serving,
    ready: meReady, face: -1, shirt: TEAM[0].shirt, hair: TEAM[0].hair, racket: TEAM[0].racket,
  });

  // Clay dust puffs
  for (const d of G.dust) {
    const [dx, dy] = iso(d.x, d.y, d.z);
    P.dot(dx, dy, 1.8, 'coral', 0.55);
  }

  // Hit spark
  if (G.spark > 0 && G.sparkAt) {
    const [qx, qy] = iso(G.sparkAt.x, G.sparkAt.y, G.sparkAt.z);
    for (let k = 0; k < 6; k++) {
      const a = k * TAU / 6 + 0.3;
      P.line([[qx + Math.cos(a) * 4, qy + Math.sin(a) * 4], [qx + Math.cos(a) * 10, qy + Math.sin(a) * 10]], 1.4, 'sun', false, 0.1);
    }
  }
}

/* ---------- Viewport, cache & loop ---------- */

const corners = [];
for (const x of [-16.2, 16.2]) for (const y of [-10.8, 10.8]) for (const z of [-0.6, 4.2]) corners.push(iso(x, y, z));
const X0 = Math.min(...corners.map(p => p[0])) - 18;
const X1 = Math.max(...corners.map(p => p[0])) + 18;
const Y0 = Math.min(...corners.map(p => p[1])) - 18;
const Y1 = Math.max(...corners.map(p => p[1])) + 18;
const BW = X1 - X0, BH = Y1 - Y0;

let scale = 1, ox = 0, oy = 0, baseCache = new Map();
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const vw = Math.max(1, window.innerWidth);
  const vh = Math.max(1, window.innerHeight);
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  scale = Math.min(canvas.width / BW, canvas.height / BH) * 0.96;
  ox = (canvas.width - BW * scale) / 2 - X0 * scale;
  oy = (canvas.height - BH * scale) / 2 - Y0 * scale;
  baseCache = new Map();
}

function getBase(boil) {
  let cv = baseCache.get(boil);
  if (cv) return cv;
  cv = document.createElement('canvas');
  cv.width = canvas.width;
  cv.height = canvas.height;
  const c = cv.getContext('2d');
  c.fillStyle = '#fff';
  c.fillRect(0, 0, cv.width, cv.height);
  c.setTransform(scale, 0, 0, scale, ox, oy);
  drawCourtBase(Pen(c, hash('court', boil)), rand(hash('court', 'layout')));
  baseCache.set(boil, cv);
  return cv;
}

function draw() {
  const boil = reducedMotion ? 0 : Math.floor(G.time * 4) % 3;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(getBase(boil), 0, 0);

  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  drawLive(Pen(ctx, hash('live', boil)), G.time);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';

  let night = false;
  try { night = localStorage.getItem('theme') === 'night'; } catch (e) {}
  if (night) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = '#b9c0e0';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* ---------- Input ---------- */

canvas.addEventListener('pointerdown', () => {
  canvas.focus({ preventScroll: true });
  tap();
});
canvas.addEventListener('keydown', e => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  e.preventDefault();
  if (!e.repeat) tap();
});

/* ---------- Sound ---------- */

let audio = null, muted = false, noiseBuffer = null;
function ensureAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
