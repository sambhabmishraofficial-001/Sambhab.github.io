<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balote</title>
<style>
  :root { --ink: #23272a; --muted: #6b7b8e; --paper: #fff; --a: #ec6450; --b: #2e4682; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  #scores { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 2px; pointer-events: none; }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); align-items: flex-end; }
  .team { display: flex; align-items: center; gap: 8px; }
  .team b { font-size: 16px; font-weight: 600; min-width: 1ch; font-variant-numeric: tabular-nums; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 6px; height: 6px; background: currentColor; border-radius: 1px; }
  .dots i.off { opacity: 0.16; }
  #you { color: var(--a); } #rival { color: var(--b); }
  #status { color: var(--muted); }
  button { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Mediterranean bocce court. Drag back and release to throw your red ball near the small yellow jack."></canvas></div>
<div id="scores">
  <div class="team" id="you"><b id="s0">0</b><div class="dots" id="d0"></div></div>
  <div class="team" id="rival"><b id="s1">0</b><div class="dots" id="d1"></div></div>
</div>
<div class="hud" id="bottom">
  <div id="status" role="status" aria-live="polite"></div>
  <button id="mute" type="button" aria-pressed="false">sound on</button>
</div>
<script src="../shell.js"></script>
<script>
PixelPlays.mount({
  id: 'balote',
  rules: [
    'Get your red balls closer to the small yellow jack than the blue ones.',
    'Drag back and release to throw. A longer pull throws further. Keyboard: arrows to aim and set power, space to throw.',
    'Whoever is further from the jack throws next.',
    'After all eight balls, you score one point for each ball closer than the rival’s best. First to 5 wins.',
  ],
});
</script>
<script src="../riso.js"></script>
<script>
'use strict';

const { PAL, TAU, clamp, lerp, ease, hash, rand, ellipse, circle, createPatternCache, createPen, applyNight } = RisoKit;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const patCache = createPatternCache(ctx);

const TW = 26, TH = 13, TZ = 19;
const iso = (x, y, z = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - z * TZ];
const flat = (x0, y0, z, x1, y1) => [iso(x0, y0, z), iso(x1, y0, z), iso(x1, y1, z), iso(x0, y1, z)];
const faceL = (x0, y0, z, x1, y1, h) => [iso(x0, y1, z), iso(x1, y1, z), iso(x1, y1, z + h), iso(x0, y1, z + h)];
const faceR = (x0, y0, z, x1, y1, h) => [iso(x1, y0, z), iso(x1, y1, z), iso(x1, y1, z + h), iso(x1, y0, z + h)];

function block(P, x0, y0, z0, x1, y1, z1, fills, o = {}) {
  const h = z1 - z0, s = o.shade ?? 1;
  const L = faceL(x0, y0, z0, x1, y1, h), Rf = faceR(x0, y0, z0, x1, y1, h), T = flat(x0, y0, z1, x1, y1);
  P.paint(L, fills, 0.85, 0.1 * s);
  P.paint(Rf, fills, 1, 0.25 * s);
  P.paint(T, o.top || fills, 0.6, 0);
  const lw = o.lw ?? 0.9;
  P.line(L, lw, 'blue', true, 0.3); P.line(Rf, lw, 'blue', true, 0.3); P.line(T, lw, 'blue', true, 0.3);
}

/* ---------- Game physics (authentic Balote mechanics, MIT) ---------- */
const COURT_X = 12, COURT_Y = 3.8, BOARD = 0.32;
const THROW_X = 9.5, GRAVITY = 12, LAUNCH_VZ = 3, ROLL_DECEL = 6, MAX_SPEED = 15;
const WIN_SCORE = 5, BALLS_PER_TEAM = 4, BALL_R = 0.32, JACK_R = 0.18;

const G = {
  phase: 'settle-jack', score: [0, 0], starter: 0, team: 0, left: [4, 4],
  jack: null, balls: [], tracks: [], yaw: Math.PI, power: 0, swing: 0, released: false,
  ai: null, timer: 0, load: 1, time: 0, result: null, status: '',
};
const nodes = {
  s: [document.getElementById('s0'), document.getElementById('s1')],
  d: [document.getElementById('d0'), document.getElementById('d1')],
  status: document.getElementById('status'),
};
function setStatus(text) { if (text !== G.status) { G.status = text; nodes.status.textContent = text; } }
function renderHud() {
  for (let t = 0; t < 2; t++) {
    nodes.s[t].textContent = G.score[t];
    if (nodes.d[t].children.length !== BALLS_PER_TEAM) nodes.d[t].innerHTML = '<i></i>'.repeat(BALLS_PER_TEAM);
    [...nodes.d[t].children].forEach((el, k) => el.classList.toggle('off', k >= G.left[t]));
  }
}
function makeBall(x, y, z, team, r, mass) { return { x, y, z, vx: 0, vy: 0, vz: 0, team, r, mass }; }
const allBalls = () => G.jack ? [G.jack, ...G.balls] : G.balls;
function nearest(team) {
  let best = Infinity;
  for (const b of G.balls) if (b.team === team) best = Math.min(best, Math.hypot(b.x - G.jack.x, b.y - G.jack.y));
  return best;
}
function newFrame() {
  G.balls = []; G.tracks = [];
  const jx = -8 + Math.random() * 5, jy = (Math.random() - 0.5) * 4.4;
  G.jack = makeBall(jx + 2.4, jy * 0.6, 0.9, -1, JACK_R, 0.25);
  G.jack.vx = -3.6; G.jack.vy = jy * 0.35; G.jack.vz = 1.6;
  G.left = [BALLS_PER_TEAM, BALLS_PER_TEAM];
  G.result = null; G.phase = 'settle-jack';
  renderHud();
}
function planAI() {
  const mine = nearest(1), yours = nearest(0);
  let tx = G.jack.x, ty = G.jack.y, extra = 0;
  if (yours < 1 && yours < mine && Math.random() < 0.45) {
    let target = null, best = Infinity;
    for (const b of G.balls) if (b.team === 0) { const d = Math.hypot(b.x - G.jack.x, b.y - G.jack.y); if (d < best) { best = d; target = b; } }
    if (target) { tx = target.x; ty = target.y; extra = 3.2; }
  }
  const dist = Math.hypot(tx - THROW_X, ty) + extra;
  const air = 2 * LAUNCH_VZ / GRAVITY + 0.08;
  const v = (-air + Math.sqrt(air * air + 2 * dist / ROLL_DECEL)) * ROLL_DECEL;
  return { power: clamp(v * (1 + (Math.random() - 0.5) * 0.13) / MAX_SPEED, 0.12, 1), yaw: Math.atan2(ty, tx - THROW_X) + (Math.random() - 0.5) * 0.07 };
}
function nextTurn() {
  if (!G.left[0] && !G.left[1]) return endFrame();
  const d = [nearest(0), nearest(1)];
  let t;
  if (d[0] === Infinity && d[1] === Infinity) t = G.starter;
  else if (d[0] === Infinity) t = 0;
  else if (d[1] === Infinity) t = 1;
  else t = d[0] > d[1] ? 0 : 1;
  if (!G.left[t]) t = 1 - t;
  G.team = t; G.power = 0; G.swing = 0; G.load = 0;
  G.yaw = Math.atan2(G.jack.y, G.jack.x - THROW_X);
  G.phase = 'aim';
  if (t === 1) { G.ai = planAI(); G.timer = 0; setStatus('rival is lining up'); }
  else setStatus('drag back, release to throw');
}
function releaseThrow() {
  if (G.power < 0.05) { G.power = 0; return; }
  G.phase = 'swing'; G.swing = 0; G.released = false; setStatus('');
}
function launch() {
  const fx = Math.cos(G.yaw), fy = Math.sin(G.yaw);
  const b = makeBall(THROW_X + fx * 0.8, fy * 0.8, 0.72, G.team, BALL_R, 1);
  const v = G.power * MAX_SPEED;
  b.vx = fx * v; b.vy = fy * v; b.vz = LAUNCH_VZ;
  G.balls.push(b); G.left[G.team]--;
  renderHud(); sound('whoosh');
}
function endFrame() {
  const d = [nearest(0), nearest(1)], winner = d[0] < d[1] ? 0 : 1, other = d[1 - winner];
  const counted = G.balls.filter(b => b.team === winner && Math.hypot(b.x - G.jack.x, b.y - G.jack.y) < other);
  G.score[winner] += counted.length; G.starter = winner; G.result = { winner, counted }; G.timer = 0;
  renderHud(); sound('point');
  const n = counted.length, who = winner === 0 ? 'you take' : 'rival takes';
  if (G.score[winner] >= WIN_SCORE) { G.phase = 'over'; setStatus((winner === 0 ? 'you win ' : 'rival wins ') + G.score[0] + '–' + G.score[1] + ' · tap to play again'); }
  else { G.phase = 'frame-end'; setStatus(who + ' ' + n + (n === 1 ? ' point' : ' points') + ' · tap to continue'); }
}
function stepPhysics(dt) {
  const list = allBalls();
  for (const b of list) {
    if (b.z > b.r || b.vz > 0) {
      b.vz -= GRAVITY * dt; b.z += b.vz * dt;
      if (b.z <= b.r) { b.z = b.r; if (b.vz < -1.6) { sound('thud', Math.min(1, -b.vz / 5)); b.vz *= -0.22; b.vx *= 0.82; b.vy *= 0.82; } else b.vz = 0; }
    }
    // A collision can shove a grounded ball downward. Leave it there or the turn never ends.
    if (b.z <= b.r && b.vz < 0) { b.z = b.r; b.vz = 0; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    const sp = Math.hypot(b.vx, b.vy);
    if (b.z <= b.r + 0.001 && sp > 0) {
      if (sp > 0.6 && Math.random() < 0.35) { G.tracks.push([b.x, b.y]); if (G.tracks.length > 140) G.tracks.shift(); }
      const next = Math.max(0, sp - ROLL_DECEL * dt);
      b.vx *= next / sp; b.vy *= next / sp;
      if (next < 0.03) { b.vx = 0; b.vy = 0; }
    }
    if (b.z < BOARD + b.r) {
      const lx = COURT_X - b.r, ly = COURT_Y - b.r;
      if (Math.abs(b.x) > lx) { b.x = Math.sign(b.x) * lx; b.vx *= -0.5; sound('board', Math.min(1, Math.abs(b.vx) / 4)); }
      if (Math.abs(b.y) > ly) { b.y = Math.sign(b.y) * ly; b.vy *= -0.5; sound('board', Math.min(1, Math.abs(b.vy) / 4)); }
    }
  }
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j], minD = a.r + b.r;
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, dd = Math.hypot(dx, dy, dz);
    if (dd >= minD || dd === 0) continue;
    const nx = dx / dd, ny = dy / dd, nz = dz / dd, overlap = minD - dd, total = a.mass + b.mass;
    a.x -= nx * overlap * b.mass / total; a.y -= ny * overlap * b.mass / total;
    b.x += nx * overlap * a.mass / total; b.y += ny * overlap * a.mass / total;
    const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny + (b.vz - a.vz) * nz;
    if (rel >= 0) continue;
    const imp = -1.82 * rel / (1 / a.mass + 1 / b.mass);
    a.vx -= imp / a.mass * nx; a.vy -= imp / a.mass * ny; a.vz -= imp / a.mass * nz;
    b.vx += imp / b.mass * nx; b.vy += imp / b.mass * ny; b.vz += imp / b.mass * nz;
    sound('clack', Math.min(1, -rel / 6));
  }
}
const atRest = () => allBalls().every(b => !b.vx && !b.vy && !b.vz && b.z <= b.r + 0.001);
function update(dt) {
  G.time += dt;
  for (let k = 0; k < 4; k++) stepPhysics(dt / 4);
  if (G.phase === 'settle-jack') { setStatus(''); if (atRest()) nextTurn(); }
  else if (G.phase === 'aim') {
    G.load = Math.min(1, G.load + dt / 0.28);
    if (G.team === 1) {
    G.timer += dt;
    const t = clamp((G.timer - 0.55) / 0.7, 0, 1);
    const turn = Math.atan2(Math.sin(G.ai.yaw - G.yaw), Math.cos(G.ai.yaw - G.yaw));
    G.yaw = wrapAim(G.yaw + turn * Math.min(1, dt * 6));
    G.power = G.ai.power * ease(t);
    if (t >= 1 && G.timer > 1.45) releaseThrow();
    }
  } else if (G.phase === 'swing') {
    G.swing = Math.min(1, G.swing + dt / 0.22);
    if (!G.released && G.swing > 0.62) { G.released = true; launch(); }
    if (G.swing >= 1) { G.phase = 'roll'; G.timer = 0; }
  } else if (G.phase === 'roll') {
    G.timer += dt;
    if (G.timer > 0.25 && atRest()) nextTurn();
  } else { G.timer += dt; }
}

/* ---------- Risograph Bocce Court Drawing ---------- */

function drawBase(P, R) {
  block(P, -15, -7.2, -0.5, 15, 7.2, 0, PAL.WOOD_DK, { top: PAL.GREEN });
  for (let n = 0; n < 220; n++) {
    const x = -14.5 + R() * 29, y = -6.8 + R() * 13.6;
    if (Math.abs(x) < COURT_X + 0.5 && Math.abs(y) < COURT_Y + 0.5) continue;
    const [gx, gy] = iso(x, y, 0.01);
    P.line([[gx, gy], [gx + (R() - 0.5) * 2, gy - 2.5 - R() * 2]], 0.65, R() < 0.6 ? 'teal' : 'sun', false, 0.1);
  }
  // Sandy gravel bocce lane
  P.shape(flat(-COURT_X, -COURT_Y, 0.01, COURT_X, COURT_Y), PAL.SAND, { lw: 0.85 });
  P.chalk([iso(-8, -COURT_Y, 0.02), iso(-8, COURT_Y, 0.02)], 1.4);
  P.chalk([iso(8, -COURT_Y, 0.02), iso(8, COURT_Y, 0.02)], 1.4);

  // Timber perimeter boards
  block(P, -COURT_X - BOARD, -COURT_Y - BOARD, 0, COURT_X + BOARD, -COURT_Y, BOARD, PAL.WOOD_DK);
  block(P, -COURT_X - BOARD, COURT_Y, 0, COURT_X + BOARD, COURT_Y + BOARD, BOARD, PAL.WOOD_DK);
  block(P, -COURT_X - BOARD, -COURT_Y, 0, -COURT_X, COURT_Y, BOARD, PAL.WOOD);
  block(P, COURT_X, -COURT_Y, 0, COURT_X + BOARD, COURT_Y, BOARD, PAL.WOOD);

  // Shade bench + wine jug & crate behind court
  block(P, -2.3, -5.3, 0.6, 2.3, -4.65, 0.74, PAL.WOOD);
  block(P, -2.3, -5.35, 0.9, 2.3, -5.22, 1.45, PAL.WOOD_DK);
  for (const bx of [-2.0, 1.85]) block(P, bx, -5.2, 0, bx + 0.18, -4.7, 0.6, [['blue', 0.7]], { lw: 0.6 });
  block(P, 2.9, -5.5, 0, 3.8, -4.7, 0.52, PAL.WOOD);

  // Two olive/shade trees on the far corners
  for (const [tx, ty] of [[-12.5, -5.8], [10.5, -5.8]]) {
    const [cx, cy] = iso(tx, ty, 2.2);
    P.line([iso(tx, ty, 0), iso(tx, ty, 1.6)], 3.2, 'coral', false, 0.15);
    P.blob(cx, cy, 22, PAL.GREEN);
    P.blob(cx - 12, cy + 5, 16, PAL.LEAF);
    P.blob(cx + 12, cy + 4, 16, PAL.GREEN);
  }
}

const AIM_CONE = 0.62;
function wrapAim(yaw) {
  const y = Math.atan2(Math.sin(yaw), Math.cos(yaw));
  if (y >= 0) return clamp(y, Math.PI - AIM_CONE, Math.PI);
  return clamp(y, -Math.PI, -(Math.PI - AIM_CONE));
}
function rackPos(team, i) {
  return { x: 5.2 + i * 1.2, y: team === 0 ? 2.7 : -2.7, z: BALL_R };
}
function heldBall() {
  const fx = Math.cos(G.yaw), fy = Math.sin(G.yaw);
  const pull = G.power * 2.3;
  let x = 9.05 + pull, y = 0.7 - fy * 0.35, z = 1.35;
  if (G.phase === 'swing') {
    const t = ease(Math.min(1, G.swing / 0.62));
    x = lerp(x, THROW_X + fx * 0.8, t);
    y = lerp(y, fy * 0.8, t);
    z = lerp(1.35, 0.72, t);
  } else {
    const rack = rackPos(G.team, Math.max(0, G.left[G.team] - 1));
    const t = ease(G.load);
    x = lerp(rack.x, x, t);
    y = lerp(rack.y, y, t);
    z = lerp(rack.z, 1.35, t) + Math.sin(t * Math.PI) * 0.45;
  }
  return { x, y, z, team: G.team, r: BALL_R * 1.15 };
}
function ballFill(team) {
  if (team < 0) return [['sun', 0.98]];
  return team === 0 ? PAL.RED : [['blue', 0.85]];
}
function drawOneBall(P, b) {
  const [sx, sy] = iso(b.x, b.y, 0.02);
  P.dot(sx, sy, b.r * 16 * clamp(1 - b.z / 5, 0.4, 1), 'blue', 0.26, 0.48);
  const [bx, by] = iso(b.x, b.y, b.z);
  P.shape(circle(bx, by, b.r * 15, 14), ballFill(b.team), { lw: 0.9, amp: 0.12 });
  if (G.result && G.result.counted && G.result.counted.includes(b)) {
    P.line(circle(bx, by, b.r * 22, 16), 1.6, 'sun', true, 0.15);
  }
}
function predictShot() {
  const fx = Math.cos(G.yaw), fy = Math.sin(G.yaw), v = Math.max(0.01, G.power * MAX_SPEED);
  let x = THROW_X + fx * 0.8, y = fy * 0.8, z = 0.72, vz = LAUNCH_VZ;
  const pts = [];
  for (let k = 0; k < 90; k++) {
    vz -= GRAVITY * 0.035;
    z += vz * 0.035;
    x += fx * v * 0.035;
    y += fy * v * 0.035;
    if (Math.abs(x) > COURT_X - 0.15 || Math.abs(y) > COURT_Y - 0.15) {
      pts.push([clamp(x, -COURT_X + 0.2, COURT_X - 0.2), clamp(y, -COURT_Y + 0.2, COURT_Y - 0.2), 0.06]);
      const last = pts[pts.length - 1];
      return { pts, land: [last[0], last[1]] };
    }
    if (k % 2 === 0) pts.push([x, y, Math.max(0.06, z)]);
    if (z <= BALL_R) {
      let vx = fx * v * 0.82, vy = fy * v * 0.82;
      for (let n = 0; n < 16; n++) {
        const sp = Math.hypot(vx, vy);
        if (sp < 0.08) break;
        x += vx * 0.05; y += vy * 0.05;
        if (Math.abs(x) > COURT_X - 0.2 || Math.abs(y) > COURT_Y - 0.2) {
          x = clamp(x, -COURT_X + 0.2, COURT_X - 0.2);
          y = clamp(y, -COURT_Y + 0.2, COURT_Y - 0.2);
          pts.push([x, y, 0.06]);
          break;
        }
        const next = Math.max(0, sp - ROLL_DECEL * 0.05);
        vx *= next / sp; vy *= next / sp;
        if (n % 2 === 0) pts.push([x, y, 0.06]);
      }
      return { pts, land: [x, y] };
    }
  }
  return { pts, land: null };
}

function drawPlayer(P, x, y, shirt, active) {
  const [px, py] = iso(x, y, 0.02);
  P.dot(px, py, 7, 'blue', 0.22, 0.42);
  const crouch = active && G.phase === 'aim' ? G.power * 5 : 0;
  P.limb(px - 2, py - 12 + crouch, px - 2.5, py, 2.1, 1.5, [['blue', 0.78]]);
  P.limb(px + 2, py - 12 + crouch, px + 2.5, py, 2.1, 1.5, [['blue', 0.78]]);
  P.shape([[px - 4.6, py - 11 + crouch], [px + 4.6, py - 11 + crouch], [px + 4.2, py - 22 + crouch], [px - 4.2, py - 22 + crouch]], shirt, { lw: 0.85 });
  P.shape(circle(px, py - 26.5 + crouch, 4.2, 12), PAL.SKIN, { lw: 0.8 });
  P.dot(px, py - 28.5 + crouch, 3.8, 'blue', 0.9);
  const swing = active && G.phase === 'swing' ? lerp(-10, 12, G.swing) : (active ? -G.power * 10 : 0);
  P.limb(px - 4.4, py - 20 + crouch, px - 7 - swing * 0.5, py - 12 + crouch, 1.7, 1.3, shirt);
  P.limb(px + 4.4, py - 20 + crouch, px + 7 + swing * 0.6, py - 12 + crouch, 1.7, 1.3, shirt);
}

function drawLive(P) {
  // Subtle tracks in the sand
  for (const [tx, ty] of G.tracks) {
    const [sx, sy] = iso(tx, ty, 0.02);
    P.dot(sx, sy, 1.5, 'blue', 0.14, 0.5);
  }

  const aiming = (G.phase === 'aim' || (G.phase === 'swing' && !G.released)) && G.left[G.team] > 0;
  const held = aiming ? heldBall() : null;

  // Balls waiting beside the lane. The next one lifts into the hand on your turn.
  for (let team = 0; team < 2; team++) {
    const skip = aiming && team === G.team ? 1 : 0;
    for (let i = 0; i < G.left[team] - skip; i++) {
      drawOneBall(P, { ...rackPos(team, i), team, r: BALL_R });
    }
  }

  // Aim arc follows the real throw, including the roll after it lands.
  if (G.phase === 'aim' && G.team === 0 && G.power > 0.04) {
    const shot = predictShot();
    shot.pts.forEach((p, i) => {
      const [qx, qy] = iso(p[0], p[1], p[2]);
      P.dot(qx, qy, i === shot.pts.length - 1 ? 5 : 3.6, 'blue', 0.92);
    });
    if (shot.land) {
      const [lx, ly] = iso(shot.land[0], shot.land[1], 0.05);
      P.line(circle(lx, ly, 10, 18), 1.7, 'blue', true, 0.16);
    }
  }

  // Players standing near throwing end
  drawPlayer(P, THROW_X + 1.1, G.team === 0 ? 0.1 : 1.7, PAL.RED, G.team === 0);
  drawPlayer(P, THROW_X + 1.1, G.team === 1 ? 0.1 : -1.7, [['blue', 0.75]], G.team === 1);

  // Depth-sorted balls + jack
  const list = allBalls().slice().sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const b of list) drawOneBall(P, b);
  if (held) drawOneBall(P, held);
}

/* ---------- Viewport, cache & loop ---------- */

const corners = [];
for (const x of [-15.2, 15.2]) for (const y of [-7.5, 7.5]) for (const z of [-0.5, 4.2]) corners.push(iso(x, y, z));
const X0 = Math.min(...corners.map(p => p[0])) - 16, X1 = Math.max(...corners.map(p => p[0])) + 16;
const Y0 = Math.min(...corners.map(p => p[1])) - 16, Y1 = Math.max(...corners.map(p => p[1])) + 16;
const BW = X1 - X0, BH = Y1 - Y0;

let scale = 1, ox = 0, oy = 0, baseCache = new Map();
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(Math.max(1, window.innerWidth) * dpr);
  canvas.height = Math.round(Math.max(1, window.innerHeight) * dpr);
  scale = Math.min(canvas.width / BW, canvas.height / BH) * 0.96;
  ox = (canvas.width - BW * scale) / 2 - X0 * scale;
  oy = (canvas.height - BH * scale) / 2 - Y0 * scale;
  baseCache = new Map();
}
function getBase(boil) {
  let cv = baseCache.get(boil);
  if (cv) return cv;
  cv = document.createElement('canvas');
  cv.width = canvas.width; cv.height = canvas.height;
  const c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
  c.setTransform(scale, 0, 0, scale, ox, oy);
  drawBase(createPen(c, hash('bal', boil), createPatternCache(c)), rand(hash('bal', 'layout')));
  baseCache.set(boil, cv);
  return cv;
}
function draw() {
  const boil = reducedMotion ? 0 : Math.floor(G.time * 4) % 3;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(getBase(boil), 0, 0);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  drawLive(createPen(ctx, hash('bal', 'live', boil), patCache));
  applyNight(ctx, canvas.width, canvas.height);
}

/* ---------- Drag-back & keyboard input ---------- */
function courtPoint(x, y, z = 0) {
  const ix = (x - y) * TW / 2, iy = (x + y) * TH / 2 - z * TZ;
  const r = canvas.getBoundingClientRect();
  return {
    x: r.left + (ix * scale + ox) * r.width / canvas.width,
    y: r.top + (iy * scale + oy) * r.height / canvas.height,
  };
}
let drag = null;
canvas.addEventListener('pointerdown', e => {
  ensureAudio(); canvas.focus({ preventScroll: true });
  if (G.phase === 'over') { if (G.timer > 0.5) { G.score = [0, 0]; G.starter = 0; newFrame(); } return; }
  if (G.phase === 'frame-end') { if (G.timer > 0.4) newFrame(); return; }
  if (G.phase !== 'aim' || G.team !== 0) return;
  drag = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag || G.phase !== 'aim' || G.team !== 0) return;
  const from = courtPoint(THROW_X, 0, 0.8);
  const to = courtPoint(G.jack.x, G.jack.y, 0.2);
  let tx = to.x - from.x, ty = to.y - from.y;
  const tl = Math.hypot(tx, ty) || 1;
  tx /= tl; ty /= tl;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const back = Math.max(0, -(dx * tx + dy * ty));
  const side = dx * -ty + dy * tx;
  G.power = clamp(back / 120, 0, 1);
  if (back > 8) {
    const jackYaw = Math.atan2(G.jack.y, G.jack.x - THROW_X);
    G.yaw = wrapAim(jackYaw + clamp(side / 180, -1, 1) * 0.34);
  }
});
function endDrag() {
  if (!drag) return;
  drag = null;
  if (G.phase === 'aim' && G.team === 0) releaseThrow();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', () => { drag = null; if (G.phase === 'aim') G.power = 0; });
canvas.addEventListener('keydown', e => {
  if (G.phase === 'over' && e.key === ' ') { G.score = [0, 0]; G.starter = 0; newFrame(); return; }
  if (G.phase === 'frame-end' && e.key === ' ') { newFrame(); return; }
  if (G.phase !== 'aim' || G.team !== 0) return;
  if (e.key === 'ArrowLeft') G.yaw = wrapAim(G.yaw - 0.05);
  else if (e.key === 'ArrowRight') G.yaw = wrapAim(G.yaw + 0.05);
  else if (e.key === 'ArrowUp') G.power = clamp(G.power + 0.08, 0, 1);
  else if (e.key === 'ArrowDown') G.power = clamp(G.power - 0.08, 0, 1);
  else if (e.key === ' ') { e.preventDefault(); if (G.power < 0.1) G.power = 0.55; releaseThrow(); }
});

let audio = null, muted = false;
function ensureAudio() { if (audio) { if (audio.state === 'suspended') audio.resume(); return; } const AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
function sound(kind, amt = 0.6) {
  if (!audio || muted) return;
  const now = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  const s = { whoosh: [280, 160, 0.08, 'sine'], thud: [140, 65, 0.07, 'sine'], board: [190, 95, 0.06, 'triangle'], clack: [920, 480, 0.04, 'square'], point: [520, 780, 0.14, 'triangle'] }[kind];
  o.type = s[3]; o.frequency.setValueAtTime(s[0], now); o.frequency.exponentialRampToValueAtTime(s[1], now + s[2]);
  g.gain.setValueAtTime(0.14 * amt + 0.03, now); g.gain.exponentialRampToValueAtTime(0.001, now + s[2]);
  o.connect(g).connect(audio.destination); o.start(now); o.stop(now + s[2] + 0.01);
}
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? 'sound off' : 'sound on'; muteBtn.setAttribute('aria-pressed', String(muted)); });

addEventListener('resize', fit);
fit();
newFrame();
let last = performance.now();
function frame(now) { update(Math.min(0.04, (now - last) / 1000)); last = now; draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
