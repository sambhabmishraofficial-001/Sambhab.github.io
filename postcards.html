<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postcards - Sambhab Mishra</title>
    <link rel="stylesheet" href="style.css">
    <script>try { if (localStorage.getItem('theme') === 'night') document.documentElement.classList.add('night'); } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .subpage header:has(+ .postcards-wrap),
        .postcards-wrap,
        .subpage .container:has(.postcards-wrap) .site-footer {
            max-width: 920px;
        }

        .postcards-wrap {
            text-align: left;
            padding: 0;
        }

        /* ---------- Stamp Picker Row ---------- */
        .stamp-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .stamp-choices {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stamp-btn {
            position: relative;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            line-height: 0;
            transition: transform 0.16s ease;
        }

        .stamp-btn:hover {
            transform: translateY(-3px) rotate(-1.5deg);
        }

        .stamp-btn[aria-pressed="true"] {
            transform: translateY(-4px) rotate(1deg);
        }

        .stamp-btn[aria-pressed="true"]::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -9px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ec6450;
            transform: translateX(-50%);
        }

        .stamp-canvas {
            display: block;
            filter: drop-shadow(0 2px 3px rgba(46, 70, 130, 0.18));
        }

        .riso-pill {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            color: #2e4682;
            background: #ffffff;
            border: 1.4px solid #2e4682;
            border-radius: 999px;
            padding: 0.34rem 0.85rem;
            cursor: pointer;
            box-shadow: 2px 2px 0 rgba(46, 70, 130, 0.16);
            transition: transform 0.12s ease, background 0.12s ease;
        }

        .riso-pill:hover {
            transform: translateY(-1px);
            background: #f7f9ff;
        }

        .riso-pill.primary {
            background: #2e4682;
            color: #ffffff;
            box-shadow: 3px 3px 0 #ec6450;
        }

        .riso-pill.primary:disabled {
            opacity: 0.42;
            cursor: not-allowed;
            transform: none;
        }

        /* ---------- Risograph Postcard Composer ---------- */
        .composer-card {
            position: relative;
            background: #fffefb;
            border: 1.6px solid #2e4682;
            border-radius: 5px;
            padding: 1.35rem 1.45rem 1.15rem;
            box-shadow: 5px 5px 0 rgba(46, 70, 130, 0.11);
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) 1px minmax(200px, 0.65fr);
            gap: 1.4rem;
            margin-bottom: 2.2rem;
            background-image: radial-gradient(rgba(46, 70, 130, 0.055) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .composer-divider {
            border-left: 1.4px dashed rgba(46, 70, 130, 0.28);
            height: 100%;
        }

        .composer-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .composer-textarea {
            width: 100%;
            min-height: 132px;
            resize: vertical;
            border: 0;
            outline: none;
            background: transparent;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            line-height: 1.65;
            color: #23272a;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 26px,
                rgba(46, 70, 130, 0.11) 26px,
                rgba(46, 70, 130, 0.11) 27px
            );
            padding: 2px 4px;
        }

        .composer-textarea::placeholder {
            color: #9aa4b2;
        }

        .composer-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .ink-swatches {
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .ink-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 0;
            transition: transform 0.12s ease;
        }

        .ink-dot:hover { transform: scale(1.15); }
        .ink-dot[aria-pressed="true"] {
            border-color: #23272a;
            transform: scale(1.15);
        }

        .composer-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
        }

        .composer-stamp-slot {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            position: relative;
        }

        .postmark-svg {
            position: absolute;
            right: 84px;
            top: 16px;
            width: 88px;
            height: 58px;
            pointer-events: none;
            opacity: 0.65;
            mix-blend-mode: multiply;
        }

        .composer-sign {
            width: 100%;
            border: 0;
            border-bottom: 1.4px solid rgba(46, 70, 130, 0.32);
            background: transparent;
            padding: 4px 2px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.92rem;
            color: #23272a;
            outline: none;
        }

        .composer-sign:focus {
            border-bottom-color: #ec6450;
        }

        .composer-send-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.65rem;
        }

        .form-notice {
            font-size: 0.76rem;
            color: #c84b3a;
            min-height: 1em;
        }

        /* ---------- Clean Interactive Message Board ---------- */
        .board-bar {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .pinboard {
            position: relative;
            width: 100%;
            min-height: 460px;
            border: 1.6px solid #2e4682;
            border-radius: 8px;
            background-color: #fcfbf8;
            background-image:
                radial-gradient(rgba(46, 70, 130, 0.13) 1px, transparent 1px),
                radial-gradient(rgba(236, 100, 80, 0.08) 1px, transparent 1px);
            background-size: 22px 22px, 44px 44px;
            background-position: 0 0, 11px 11px;
            overflow: hidden;
            box-shadow: inset 0 0 24px rgba(46, 70, 130, 0.05);
            touch-action: none;
            user-select: none;
            margin-bottom: 1.5rem;
        }

        .pin-card {
            position: absolute;
            width: 268px;
            background: #fffefb;
            border: 1.5px solid #2e4682;
            border-radius: 4px;
            padding: 14px 14px 11px;
            box-shadow: 4px 5px 0 rgba(46, 70, 130, 0.12);
            cursor: grab;
            transition: box-shadow 0.14s ease;
            will-change: transform;
        }

        .pin-card.dragging {
            cursor: grabbing;
            box-shadow: 10px 14px 0 rgba(46, 70, 130, 0.16);
        }

        .pin-card.ink-coral { border-color: #c84b3a; }
        .pin-card.ink-teal { border-color: #007d7b; }
        .pin-card.ink-sun { border-color: #b78510; }

        .pin-tack {
            position: absolute;
            top: -7px;
            left: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translateX(-50%);
            border: 1.4px solid #2e4682;
            background: #ec6450;
            box-shadow: 1px 2px 0 rgba(46, 70, 130, 0.3);
            pointer-events: none;
        }

        .pin-card.ink-teal .pin-tack { background: #008a88; }
        .pin-card.ink-sun .pin-tack { background: #ffcc2e; }
        .pin-card.ink-blue .pin-tack { background: #2e4682; }

        .pin-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }

        .pin-msg {
            font-size: 0.92rem;
            line-height: 1.5;
            color: #23272a;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
        }

        .pin-stamp-wrap {
            flex-shrink: 0;
            line-height: 0;
        }

        .pin-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding-top: 7px;
            border-top: 1px dashed rgba(46, 70, 130, 0.22);
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-size: 0.72rem;
            color: #6b7b8e;
        }

        .pin-from {
            font-weight: 600;
            color: #2e4682;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pin-card.ink-coral .pin-from { color: #c84b3a; }
        .pin-card.ink-teal .pin-from { color: #007d7b; }
        .pin-card.ink-sun .pin-from { color: #9c6f00; }

        /* ---------- Night mode ---------- */
        html.night .composer-card {
            background-color: #1c2233;
            border-color: #6f86bf;
        }
        html.night .composer-textarea,
        html.night .composer-sign { color: #edf1fb; }
        html.night .pinboard {
            background-color: #161b29;
            border-color: #6f86bf;
        }
        html.night .pin-card {
            background: #20273a;
            border-color: #7c93cc;
        }
        html.night .pin-msg { color: #eef2fb; }
        html.night .pin-from { color: #9bb5f5; }
        html.night .riso-pill {
            background: #1c2233;
            color: #d6e0f8;
            border-color: #7c93cc;
        }

        @media (max-width: 720px) {
            .composer-card { grid-template-columns: 1fr; }
            .composer-divider { display: none; }
            .pinboard { min-height: 420px; }
        }
    </style>
</head>

<body class="subpage">
    <div class="container">
        <header>
            <h1>Postcards</h1>
            <a href="index.html" class="btn-back">← Back to Home</a>
        </header>

        <section class="content-section postcards-wrap">
            <div class="stamp-bar">
                <div class="stamp-choices" id="stamp-choices" role="group" aria-label="Choose a risograph stamp"></div>
                <button type="button" class="riso-pill" id="shuffle-stamps" title="Shuffle stamps">shuffle</button>
            </div>

            <form class="composer-card" id="postcard-form" aria-label="Write a postcard">
                <div class="composer-left">
                    <textarea id="postcard-text" class="composer-textarea" maxlength="240" placeholder="write something..."></textarea>
                    <div class="composer-meta-row">
                        <div class="ink-swatches" role="group" aria-label="Ink color">
                            <button type="button" class="ink-dot" data-ink="blue" style="background:#2e4682" aria-pressed="true" title="Blue"></button>
                            <button type="button" class="ink-dot" data-ink="coral" style="background:#ec6450" aria-pressed="false" title="Coral"></button>
                            <button type="button" class="ink-dot" data-ink="teal" style="background:#008a88" aria-pressed="false" title="Teal"></button>
                            <button type="button" class="ink-dot" data-ink="sun" style="background:#e6ad16" aria-pressed="false" title="Sun"></button>
                        </div>
                    </div>
                </div>

                <div class="composer-divider" aria-hidden="true"></div>

                <div class="composer-right">
                    <div class="composer-stamp-slot">
                        <svg class="postmark-svg" viewBox="0 0 110 72" aria-hidden="true">
                            <circle cx="34" cy="36" r="24" fill="none" stroke="#2e4682" stroke-width="1.5" stroke-dasharray="3 2" />
                            <circle cx="34" cy="36" r="17" fill="none" stroke="#2e4682" stroke-width="1" />
                            <path d="M58 24 q10 -6 20 0 t20 0 M58 34 q10 -6 20 0 t20 0 M58 44 q10 -6 20 0 t20 0" fill="none" stroke="#2e4682" stroke-width="1.3" stroke-linecap="round" />
                        </svg>
                        <div id="active-stamp-preview"></div>
                    </div>

                    <input id="postcard-from" class="composer-sign" type="text" maxlength="42" placeholder="from (optional)">

                    <div class="composer-send-row">
                        <span class="form-notice" id="form-notice" role="alert" aria-live="polite"></span>
                        <button type="submit" class="riso-pill primary" id="send-btn" disabled>pin it</button>
                    </div>
                </div>
            </form>

            <div class="board-bar">
                <button type="button" class="riso-pill" id="btn-tidy">tidy</button>
                <button type="button" class="riso-pill" id="btn-scatter">scatter</button>
            </div>

            <div class="pinboard" id="pinboard" aria-label="Interactive stamped postcard message board"></div>
        </section>

        <footer class="site-footer">
            <span>© 2026 Sambhab Mishra</span>
            <span class="footer-links">
                <a href="mailto:Sambhabmishraofficial@gmail.com">Email</a> ·
                <a href="https://x.com/Sambhab_Mishra" target="_blank" rel="noopener">X</a> ·
                <a href="https://linkedin.com/in/sambhab-mishra-ସମ୍ଭବ-ମିଶ୍ର-4149431b5/" target="_blank" rel="noopener">LinkedIn</a> ·
                <a href="https://en.wikipedia.org/wiki/Sambhab_Mishra" target="_blank" rel="noopener">Wikipedia</a>
            </span>
        </footer>
    </div>

    <script src="postcards.js"></script>
</body>

</html>
