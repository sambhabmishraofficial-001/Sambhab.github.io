    <script>
        requestAnimationFrame(() => requestAnimationFrame(() => { document.getElementById('main').style.opacity = 1; }));

        const themeBtn = document.getElementById('theme-toggle');
        const syncThemeBtn = () => {
            const night = document.documentElement.classList.contains('night');
            themeBtn.setAttribute('aria-label', night ? 'Switch to day mode' : 'Switch to night mode');
            themeBtn.title = night ? 'Day mode' : 'Night mode';
        };
        themeBtn.addEventListener('click', () => {
            const night = document.documentElement.classList.toggle('night');
            try { localStorage.setItem('theme', night ? 'night' : 'day'); } catch (e) {}
            syncThemeBtn();
        });
        syncThemeBtn();
    </script>
