<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Sambhab Mishra</title>
    <link rel="stylesheet" href="style.css">
    <script>try { if (localStorage.getItem('theme') === 'night') document.documentElement.classList.add('night'); } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="subpage fun-body">
    <div class="container">
        <header>
            <a href="index.html" class="btn-back">← Back to Home</a>
            <nav class="game-switcher" aria-label="Choose a game">
                <button type="button" class="game-switch-btn active" data-src="games/tie-break/index.html">Tie-Break</button>
                <button type="button" class="game-switch-btn" data-src="games/stari-most/index.html">Stari Most</button>
                <button type="button" class="game-switch-btn" data-src="games/mini-ramp/index.html">Mini Ramp</button>
                <button type="button" class="game-switch-btn" data-src="games/balote/index.html">Balote</button>
            </nav>
            <a href="games/tie-break/index.html" id="game-full-link" class="game-open-btn">Full screen ↗</a>
        </header>

        <section class="content-section fun-page">
            <iframe class="game-frame" id="game-frame" src="games/tie-break/index.html" title="Tie-Break"></iframe>
        </section>

        <footer class="site-footer">
            <span>© 2026 Sambhab Mishra</span>
            <span class="footer-links">
                <a href="mailto:Sambhabmishraofficial@gmail.com">Email</a> ·
                <a href="https://x.com/Sambhab_Mishra" target="_blank" rel="noopener">X</a> ·
                <a href="https://linkedin.com/in/sambhab-mishra-ସମ୍ଭବ-ମିଶ୍ର-4149431b5/" target="_blank" rel="noopener">LinkedIn</a> ·
                <a href="https://en.wikipedia.org/wiki/Sambhab_Mishra" target="_blank" rel="noopener">Wikipedia</a>
            </span>
        </footer>
    </div>

    <script>
        const frame = document.getElementById('game-frame');
        const fullLink = document.getElementById('game-full-link');
        const btns = [...document.querySelectorAll('.game-switch-btn')];
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                const src = btn.dataset.src;
                frame.src = src;
                frame.title = btn.textContent;
                fullLink.href = src;
                btns.forEach(b => b.classList.toggle('active', b === btn));
            });
        });
    </script>
</body>

</html>
