<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun - Sambhab Mishra</title>
    <link rel="stylesheet" href="style.css">
    <script>try { if (localStorage.getItem('theme') === 'night') document.documentElement.classList.add('night'); } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="subpage">
    <div class="container">
        <header>
            <h1>Fun</h1>
            <a href="index.html" class="btn-back">← Back to Home</a>
        </header>

        <section class="content-section fun-page">
            <nav class="fun-nav" aria-label="Fun sections">
                <a href="#pixel-animations" class="fun-tab">Pixel Animations</a>
                <a href="#games" class="fun-tab">Games</a>
            </nav>

            <div class="fun-part" id="pixel-animations">
                <h2>Pixel Animations</h2>
                <div class="fun-grid">
                    <figure class="fun-card">
                        <canvas class="pixel-canvas is-compact" data-scene="./animations/jacket-pause/jacket-pause.js" aria-label="Pixel animation: Jensen takes a quiet pause"></canvas>
                        <figcaption class="pixel-caption">#Bringbackjensen · a quiet pause</figcaption>
                    </figure>
                    <figure class="fun-card">
                        <canvas class="pixel-canvas" data-scene="./animations/bicycle/bicycle.js" aria-label="Pixel animation: someone repairing a bicycle while a cat naps"></canvas>
                        <figcaption class="pixel-caption">Afternoon bicycle repair</figcaption>
                    </figure>
                    <figure class="fun-card">
                        <canvas class="pixel-canvas" data-scene="./animations/pottery/pottery.js" aria-label="Pixel animation: a potter at the wheel beside a pond with a duck"></canvas>
                        <figcaption class="pixel-caption">Pottery by the pond</figcaption>
                    </figure>
                    <figure class="fun-card">
                        <canvas class="pixel-canvas" data-scene="./animations/painter/painter.js" aria-label="Pixel animation: an artist painting a landscape on an easel"></canvas>
                        <figcaption class="pixel-caption">An afternoon at the easel</figcaption>
                    </figure>
                    <figure class="fun-card">
                        <canvas class="pixel-canvas" data-scene="./animations/snake-charmer/snake-charmer.js" aria-label="Pixel animation: a snake charmer plays the pungi as a cobra rises from its basket"></canvas>
                        <figcaption class="pixel-caption">The snake charmer</figcaption>
                    </figure>
                    <figure class="fun-card">
                        <canvas class="pixel-canvas" data-scene="./animations/tightrope/tightrope.js" aria-label="Pixel animation: a girl walks a tightrope at a mela with a pot on her head while a drummer plays"></canvas>
                        <figcaption class="pixel-caption">Rope walk at the mela</figcaption>
                    </figure>
                    <figure class="fun-card">
                        <canvas class="pixel-canvas" data-scene="./animations/chai/chai.js" aria-label="Pixel animation: a chaiwala pours tea from a height at a roadside stall"></canvas>
                        <figcaption class="pixel-caption">Chai on the corner</figcaption>
                    </figure>
                    <figure class="fun-card">
                        <canvas class="pixel-canvas" data-scene="./animations/fishing/fishing.js" aria-label="Pixel animation: a man fishing at a village pond beside a thatched hut while an egret wades"></canvas>
                        <figcaption class="pixel-caption">Fishing in the village</figcaption>
                    </figure>
                    <figure class="fun-card">
                        <canvas class="pixel-canvas" data-scene="./animations/canoe/canoe.js" aria-label="Pixel animation: two people paddle a canoe across a river between two jetties"></canvas>
                        <figcaption class="pixel-caption">Canoe on the river</figcaption>
                    </figure>
                    <p class="fun-credit">Jensen, bicycle repair and pottery scenes from <a href="https://github.com/Tu-Zhenzhao/pocketworld" target="_blank" rel="noopener">pocketworld</a> by Zhenzhao Tu (MIT License).</p>
                </div>
            </div>

            <div class="fun-part" id="games">
                <h2>Games</h2>
                <article class="game-card">
                    <div class="game-card-head">
                        <div>
                            <h3>Tie-Break</h3>
                            <p class="game-desc">Clay-court tennis. Tap, click, or press space to serve and hit when the yellow ring is away from your rival.</p>
                        </div>
                        <a href="games/tie-break/index.html" class="game-open-btn">Play full screen ↗</a>
                    </div>
                    <div class="game-frame-wrap">
                        <iframe class="game-frame" src="games/tie-break/index.html" title="Tie-Break clay tennis game" loading="lazy"></iframe>
                    </div>
                </article>
            </div>
        </section>
    </div>

    <script type="module">
        const canvases = [...document.querySelectorAll('canvas[data-scene]')];
        const renderers = await Promise.all(canvases.map(async canvas => {
            const { default: scene } = await import(canvas.dataset.scene);
            return scene.createRenderer(canvas);
        }));
        const start = performance.now();
        function frame(now) {
            const t = (now - start) / 1000;
            for (const r of renderers) r.draw(t, { opaque: true });
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>

</html>
